# Dependabot（docs/development）：GitHub 开源后启用依赖自动升级。
# pnpm workspace：根目录 pnpm-lock.yaml 管全部（root + ui），npm ecosystem 指向 / 即可覆盖。
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7.0 lacks the compiler API required by typescript-eslint.
      # Revisit when typescript-eslint supports TS 7 and lint/test/build pass; keep TS 6 updates enabled.
      - dependency-name: typescript
        versions: [">=7.0.0 <8.0.0"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
