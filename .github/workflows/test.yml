# CodeWave Test（2026-09-13 由 ci.yml 收窄而来：只跑前后端测试，不做任何 build）
# 触发语义：push main（合并后验证）/ pull_request（PR 检查）；push 其他分支不跑。
# 构建产物归 release（tag v*）——前端 vite build / tsc 类型检查也随之移交 tag 时点。
# 三平台跑 cargo test：Windows 验证 git2/libgit2 构建链（G8）；前端 vitest 三平台全量。
# tauri CLI 从仓库根运行（root package.json + pnpm workspace，见 docs/p0-implementation-report 布局说明）。
# 注：MCP 真实 server 测试（mcp::tests::real_*）依赖 node，setup-node 已满足。
name: test

on:
  push:
    # push 只监听 main；PR 分支由 pull_request 触发，避免同一提交双跑
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:

# docs/oss-prep-batch：同分支新提交取消在途旧跑
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
          - os: ubuntu-24.04
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      - name: Install deps (pnpm workspace：root + ui 一次装齐)
        run: pnpm install --frozen-lockfile

      - name: Frontend tests
        run: pnpm --dir ui test

      # tsc 类型检查随 vite build 走；产物留在 runner 不上传，正式产物归 release（tag v*）
      - name: Frontend build
        run: pnpm --dir ui build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --workspace
