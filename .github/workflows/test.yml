# Three-platform frontend/script and Rust tests run in parallel; build stays with Rust.
# Release artifacts remain exclusive to release.yml. See docs/testing.md for metrics.
name: test

on:
  push:
    # push 只监听 main；PR 分支由 pull_request 触发，避免同一提交双跑
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:

# docs/development：同分支新提交取消在途旧跑
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Keep job ID test: rust-cache uses it in the existing cache namespace.
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
          - os: ubuntu-24.04
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        id: rust-cache
        with:
          workspaces: src-tauri

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/ensure-cmake.ps1

      - name: Install deps (pnpm workspace：root + ui 一次装齐)
        run: node scripts/ci/metrics.mjs run -- pnpm install --frozen-lockfile

      # Tauri frontendDist and real MCP server fixtures still need the pnpm workspace.
      # Keep the short build here so Rust does not wait for the frontend test matrix.
      - name: Frontend build
        run: node scripts/ci/metrics.mjs run -- pnpm --dir ui build

      - name: Rust tests
        working-directory: src-tauri
        run: node ../scripts/ci/metrics.mjs run -- cargo test --workspace

      - name: CI environment summary
        if: always()
        env:
          CI_RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: node scripts/ci/metrics.mjs environment

  frontend:
    name: Frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install deps
        run: node scripts/ci/metrics.mjs run -- pnpm install --frozen-lockfile
      - name: Frontend tests
        run: node scripts/ci/metrics.mjs run -- pnpm --dir ui test

      # scripts/ 下的 node:test 单测（fix-updater-json 等，仅 node 内置模块、零第三方依赖）。
      # 用引号包住 glob 交给 node 自己展开：node --test 不认目录参数（会把目录当模块加载而失败），
      # 而 pwsh 不会为原生命令展开通配符，所以不能写成让 shell 展开的形式。
      - name: Scripts tests
        run: node --test "scripts/**/*.test.mjs"

      - name: CI environment summary
        if: always()
        run: node scripts/ci/metrics.mjs environment

  validation:
    # Preserve the three existing check names. Each is deliberately an all-platform gate:
    # no skipped, cancelled or failed matrix component can satisfy a required check.
    name: Test (${{ matrix.os }})
    if: ${{ always() }}
    needs: [test, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every matrix component
        env:
          BACKEND_RESULT: ${{ needs.test.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        # 单行 && 串联：多行 `run: |` 下各条 test 的退出码**只取最后一条**，
        # frontend 成功不能掩盖 backend 失败。
        run: test "$BACKEND_RESULT" = success && test "$FRONTEND_RESULT" = success
