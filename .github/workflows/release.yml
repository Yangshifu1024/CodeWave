# CodeWave Release（docs/oss-prep-batch：pnpm workspace + Tauri v2）
# tag（v*）推送 → 创建 draft Release → 三平台 tauri-action 构建并上传产物 → 人工检查后手动发布。
# 触发约定：从 main 打 v* tag（workflow 语法无法限定 tag 所在分支，靠操作纪律）。
# draft 语义：tauri-action 只上传产物与更新器文件，绝不自动发布——人工核对资产/说明后点 Publish。
# 2026-09-13：三个平台 job 收敛为 matrix；唯一构建流水线（test/lint 只做测试与检查，不 build）。
# 签名 secrets：TAURI_SIGNING_PRIVATE_KEY 已配置（无密码密钥，密码 secret 留空），updater
# 产物（*.sig + latest.json）随 release 上传；macOS 公证 APPLE_* 仍可选，未设置时出未签名
# .app/.dmg（docs/version-bump-and-release：自动更新链路说明）。
name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 生成 release notes 需要完整 tag/历史（默认 1 层浅克隆拿不到区间提交）
          fetch-depth: 0
      # GitHub 自动 release notes 只列「合并的 PR」；本项目以直接推送 main 为主，
      # 不走 PR 的提交会被整段漏掉（v0.3.1 实测正文只剩一行链接）。改为自建正文：
      # 逐条列出上一 tag 到本 tag 的全部提交。
      - name: Build release notes
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          {
            echo "## What's Changed"
            if [ -n "$prev" ]; then
              git log --no-decorate --format='- %s (%h)' "${prev}..${tag}"
              echo
              echo "**Full Changelog**: https://github.com/Yangshifu1024/CodeWave/compare/${prev}...${tag}"
            else
              git log --no-decorate --format='- %s (%h)' "${tag}"
            fi
          } > body.md
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat body.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body: ${{ steps.notes.outputs.body }}

  build:
    name: Build (${{ matrix.label }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS
          - os: ubuntu-24.04
            label: Linux
          - os: windows-2022
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 更新器签名：TAURI_SIGNING_PRIVATE_KEY 已配置（无密码密钥，密码 secret 留空即匹配）
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          # 仅 macOS 需要 aarch64 target；非 macOS 传空串等价于缺省
          targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      - run: pnpm install --frozen-lockfile

      # macOS 签名/公证 secrets 全部可选：tauri bundler 会把「存在但为空」的 env 当作已配置，
      # 空 APPLE_CERTIFICATE 在 keychain 导入处必崩（v0.3.0 macOS job 实测），因此仅在
      # secret 非空时经 GITHUB_ENV 导出；全部未配置 → 出未签名 .app/.dmg（首次打开需右键放行）
      - name: Export optional macOS signing envs
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name=$value" >> "$GITHUB_ENV"
            fi
          done
          # tauri-action 不负责写 .p8 文件（源码无此逻辑），必须在此落盘；
          # APPLE_API_KEY_PATH 必须绝对路径：bundler 在临时目录调用 notarytool，
          # 相对路径报 The file couldn't be opened（GitWave v0.3.0 实测，docs/macos-signing-and-notarization）
          if [ -n "$APPLE_API_KEY" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > AuthKey.p8
            grep -q '^-----BEGIN PRIVATE KEY-----$' AuthKey.p8 || {
              echo "::error::APPLE_API_KEY_P8 缺少 BEGIN 私钥行，内容损坏；用 gh secret set APPLE_API_KEY_P8 < AuthKey_XXX.p8 重设"
              exit 1
            }
            grep -q '^-----END PRIVATE KEY-----$' AuthKey.p8 || {
              echo "::error::APPLE_API_KEY_P8 缺少 END 私钥行，内容损坏；用 gh secret set APPLE_API_KEY_P8 < AuthKey_XXX.p8 重设"
              exit 1
            }
            echo "APPLE_API_KEY_PATH=${{ github.workspace }}/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Tauri build + upload
        uses: tauri-apps/tauri-action@action-v1.0.0
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
