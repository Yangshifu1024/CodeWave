# CodeWave Release（docs/oss-prep-batch：pnpm workspace + Tauri v2）
# tag（v*）推送 → 创建 draft Release → 三平台 tauri-action 构建并上传产物 → 人工检查后手动发布。
# 触发约定：从 main 打 v* tag（workflow 语法无法限定 tag 所在分支，靠操作纪律）。
# draft 语义：tauri-action 只上传产物与更新器文件，绝不自动发布——人工核对资产/说明后点 Publish。
# 2026-09-13：三个平台 job 收敛为 matrix；唯一构建流水线（test/lint 只做测试与检查，不 build）。
# 2026-09-18：新增 finalize-updater-json 收尾作业（在 build 之后）——tauri-action（action-v1.0.0）写
# latest.json 时把每个平台的 url 写成 REST 资产 API 端点（api.github.com/repos/.../releases/assets/<id>，
# 匿名配额 60 次/小时/出口 IP），配额耗尽后应用内「检查更新」下载阶段报 403 Forbidden；该作业把清单里的
# url 统一改写为 CDN 下载端点（github.com/.../releases/download/<tag>/<name>），脚本见 scripts/fix-updater-json.mjs。
# 签名 secrets：TAURI_SIGNING_PRIVATE_KEY 已配置（无密码密钥，密码 secret 留空），updater
# 产物（*.sig + latest.json）随 release 上传；macOS 公证 APPLE_*（6 个）已配置（2026-09-14 起）：
# bundler 签名并公证 .app，dmg 由后续「Notarize and staple dmg」步骤补公证；全部 APPLE_* 未
# 设置时仍出未签名 .app/.dmg（docs/version-bump-and-release：自动更新链路说明）。
name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      # 同一个正文喂给两处：draft Release 的 body（人看的）+ tauri-action 的 releaseBody，
      # 后者会被写进 latest.json 的 notes 字段，即应用内更新弹窗展示的「发布说明」。
      # 不传 releaseBody 时 notes 恒为空字符串（v0.3.8/v0.3.9 实测），弹窗就无说明可显。
      release_notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 生成 release notes 需要完整 tag/历史（默认 1 层浅克隆拿不到区间提交）
          fetch-depth: 0
      # GitHub 自动 release notes 只列「合并的 PR」；本项目以直接推送 main 为主，
      # 不走 PR 的提交会被整段漏掉（v0.3.1 实测正文只剩一行链接）。改为自建正文：
      # 逐条列出上一 tag 到本 tag 的全部提交。
      - name: Build release notes
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          {
            echo "## What's Changed"
            if [ -n "$prev" ]; then
              git log --no-decorate --format='- %s (%h)' "${prev}..${tag}"
              echo
              echo "**Full Changelog**: https://github.com/Yangshifu1024/CodeWave/compare/${prev}...${tag}"
            else
              git log --no-decorate --format='- %s (%h)' "${tag}"
            fi
          } > body.md
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat body.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body: ${{ steps.notes.outputs.body }}

  build:
    name: Build (${{ matrix.label }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS
          - os: ubuntu-24.04
            label: Linux
          - os: windows-2022
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 更新器签名：TAURI_SIGNING_PRIVATE_KEY 已配置（无密码密钥，密码 secret 留空即匹配）
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          # 仅 macOS 需要 aarch64 target；非 macOS 传空串等价于缺省
          targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      - run: pnpm install --frozen-lockfile

      # macOS 签名/公证 secrets 全部可选：tauri bundler 会把「存在但为空」的 env 当作已配置，
      # 空 APPLE_CERTIFICATE 在 keychain 导入处必崩（v0.3.0 macOS job 实测），因此仅在
      # secret 非空时经 GITHUB_ENV 导出；全部未配置 → 出未签名 .app/.dmg（首次打开需右键放行）
      - name: Export optional macOS signing envs
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name=$value" >> "$GITHUB_ENV"
            fi
          done
          # tauri-action 不负责写 .p8 文件（源码无此逻辑），必须在此落盘；
          # APPLE_API_KEY_PATH 必须绝对路径：bundler 在临时目录调用 notarytool，
          # 相对路径报 The file couldn't be opened（GitWave v0.3.0 实测，docs/macos-signing-and-notarization）
          if [ -n "$APPLE_API_KEY" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > AuthKey.p8
            grep -q '^-----BEGIN PRIVATE KEY-----$' AuthKey.p8 || {
              echo "::error::APPLE_API_KEY_P8 缺少 BEGIN 私钥行，内容损坏；用 gh secret set APPLE_API_KEY_P8 < AuthKey_XXX.p8 重设"
              exit 1
            }
            grep -q '^-----END PRIVATE KEY-----$' AuthKey.p8 || {
              echo "::error::APPLE_API_KEY_P8 缺少 END 私钥行，内容损坏；用 gh secret set APPLE_API_KEY_P8 < AuthKey_XXX.p8 重设"
              exit 1
            }
            echo "APPLE_API_KEY_PATH=${{ github.workspace }}/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Tauri build + upload
        uses: tauri-apps/tauri-action@action-v1.0.0
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          # 写入 latest.json 的 notes（应用内更新弹窗的「发布说明」）；不传则该字段为空
          releaseBody: ${{ needs.prepare-release.outputs.release_notes }}

      # bundler 只公证并 staple .app，对 dmg 仅 codesign 签名 → Gatekeeper 判
      # rejected / Unnotarized Developer ID（v0.3.4 实测，docs/macos-signing-and-notarization）。
      # 此处下载 dmg 补公证 + staple 后 --clobber 回传；未配置公证凭据时跳过
      - name: Notarize and staple dmg
        if: runner.os == 'macOS'
        run: |
          if [ -z "$APPLE_API_KEY" ]; then
            echo "未配置公证凭据，跳过 dmg 补公证"
            exit 0
          fi
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release download "${GITHUB_REF_NAME}" --pattern '*.dmg' --clobber
          dmg=$(ls *.dmg | head -1)
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          gh release upload "${GITHUB_REF_NAME}" "$dmg" --clobber

  # latest.json 后处理（同步修复「检查更新」下载阶段 403 Forbidden）：tauri-action（action-v1.0.0）
  # 写清单时每个平台的 url 用的是 REST 资产 API 端点，匿名配额只有 60 次/小时/出口 IP，耗尽即 403
  # （v0.3.8 实测响应头 x-ratelimit-remaining: 0）。CDN 端点 github.com/<owner>/<repo>/releases/
  # download/<tag>/<assetName> 由 CDN 承载、不计 API 配额，因此发布收尾时统一改写。
  #
  # 为什么必须是独立 job：三个平台各自在 tauri-action 内 delete + upload latest.json 做清单合并，
  # 任一平台还没跑完就改写，会被后续上传整体覆盖——所以必须 needs: [prepare-release, build]
  # （prepare-release 产出 release_id / 初始清单，build 保证三平台 build 全部结束），等它们都完成再收尾
  # （也因此自然排在 macOS「Notarize and staple dmg」之后；那步只 --clobber 回传 *.dmg，与 latest.json 不冲突）。
  finalize-updater-json:
    name: Finalize updater manifest
    needs: [prepare-release, build]
    # 只在构建成功时收尾：构建失败时清单本身不完整，不做任何改动（不要用 always()）
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    # draft release 仅对具备 push 资格的凭证可见：job 级权限若被收窄成 read，gh 会报 release not found
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # 从 draft release 取回三平台合并后的清单（--clobber 覆盖工作区同名文件）
      - name: Download latest.json from draft release
        run: gh release download "$GITHUB_REF_NAME" --pattern latest.json --clobber

      # 脚本自己经 gh api 取资产名（按 id 映射，同 id 的多个平台条目改写结果一致），
      # 内部先完整校验再落盘：id 查不到 / asset name 为空 / 改写后仍有 api 残留都会直接失败
      - name: Rewrite updater urls to CDN
        run: node scripts/fix-updater-json.mjs --tag "$GITHUB_REF_NAME" --in latest.json --out latest.json

      # 发布断言（写回线上之前的拦截门）：清单不得残留 api 资产端点，且所有 url 都是 github.com CDN 形态。
      # 断言读的就是上一步刚写出的本地 latest.json，所以排在 upload 之前——断言不过，坏清单不会进 draft release；
      # 失败时 release 仍是 draft，人工核对后才能点 Publish。
      # 注：JS 里不用模板字符串（${...} 写在单引号脚本里会触发 shellcheck SC2016）
      - name: Assert updater urls
        run: |
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            const entries = Object.entries(manifest.platforms || {});
            if (entries.length === 0) {
              console.error("latest.json 的 platforms 为空");
              process.exit(1);
            }
            for (const [key, entry] of entries) {
              const url = (entry && entry.url) || "";
              if (url.includes("api.github.com")) {
                console.error("平台 " + key + " 仍指向 api.github.com 资产端点：" + url);
                process.exit(1);
              }
              if (!url.startsWith("https://github.com/")) {
                console.error("平台 " + key + " 的 url 非 https://github.com/ 前缀：" + url);
                process.exit(1);
              }
            }
            console.log("[assert] " + entries.length + " 个平台 url 均为 CDN 下载形态");
          '

      # 断言通过后才回传，覆盖 draft release 上的旧清单
      - name: Upload latest.json back to draft release
        run: gh release upload "$GITHUB_REF_NAME" latest.json --clobber
