# CodeWave Release（docs/oss-prep-batch：pnpm workspace + Tauri v2）
# tag（v*）推送 → 创建 draft Release → 三平台 tauri-action 构建并上传产物 → 人工检查后手动发布。
# 触发约定：从 main 打 v* tag（workflow 语法无法限定 tag 所在分支，靠操作纪律）。
# draft 语义：tauri-action 只上传产物与更新器文件，绝不自动发布——人工核对资产/说明后点 Publish。
# 2026-09-13：三个平台 job 收敛为 matrix；唯一构建流水线（test/lint 只做测试与检查，不 build）。
# 签名 secrets：TAURI_SIGNING_PRIVATE_KEY 已配置（无密码密钥，密码 secret 留空），updater
# 产物（*.sig + latest.json）随 release 上传；macOS 公证 APPLE_* 仍可选，未设置时出未签名
# .app/.dmg（docs/version-bump-and-release：自动更新链路说明）。
name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true

  build:
    name: Build (${{ matrix.label }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS
          - os: ubuntu-24.04
            label: Linux
          - os: windows-2022
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 可选：更新器签名（tauri-plugin-updater 启用后必填）
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # 可选：macOS 签名/公证（仅 macOS 生效，未设置 → 出未签名 .app/.dmg，本机首次打开需右键放行）
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_PATH: AuthKey.p8
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          # 仅 macOS 需要 aarch64 target；非 macOS 传空串等价于缺省
          targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      - run: pnpm install --frozen-lockfile

      - name: Tauri build + upload
        uses: tauri-apps/tauri-action@action-v1.0.0
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
