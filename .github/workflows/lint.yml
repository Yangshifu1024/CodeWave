# CodeWave Lint（docs/oss-prep-batch）
# 工程惯例是「cargo test 全绿 0 warning」，fmt/clippy 尚未纳入基线——
# 两个步骤当前 continue-on-error（失败不红，产出注解供清理）；
# 本地清理完成后删除这两行 continue-on-error 即转硬门槛。
name: lint

on:
  push:
    # push 只管 main 的合并后验证；PR 分支由 pull_request 触发，避免同一提交双跑
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: cargo fmt --check
        continue-on-error: true # docs/oss-prep-batch：清理后转硬门槛
        run: cargo fmt --all -- --check
        working-directory: src-tauri
      - name: cargo clippy
        continue-on-error: true # docs/oss-prep-batch：清理后转硬门槛
        run: cargo clippy --all-targets
        working-directory: src-tauri
