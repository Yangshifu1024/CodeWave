# CodeWave Lint（docs/oss-prep-batch；2026-09-19 补前端 eslint）
# 门槛状态：
# - cargo fmt --check：已全仓清零（2026-09-19 本地重排 106 个文件）→ 硬门槛
# - cargo clippy --all-targets：生产代码（cargo clippy --lib）已零告警；tests/ 与 #[cfg(test)] 里的存量告警
#   留待专项批次，故仍 continue-on-error（失败不红，产出注解供清理）
# - 前端 eslint：本日新增（此前仓库无任何前端 lint 工具）→ 硬门槛
name: lint

on:
  push:
    # push 只管 main 的合并后验证；PR 分支由 pull_request 触发，避免同一提交双跑
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        working-directory: src-tauri
      - name: cargo clippy
        continue-on-error: true # clippy --lib（生产代码）已清零；测试代码存量告警见文件头注释
        run: cargo clippy --all-targets
        working-directory: src-tauri

  ui-lint:
    name: UI lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps (pnpm workspace：root + ui 一次装齐)
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm --dir ui run lint
