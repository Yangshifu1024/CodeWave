[package]
name = "codewave"
version = "0.8.0"
description = "CodeWave - local-first desktop AI coding agent"
license = "MIT"
repository = "https://github.com/Yangshifu1024/CodeWave"
authors = ["Yangzhenbiao"]
edition = "2024"
rust-version = "1.98"
# 多 bin 目标历史上用于承载假 LSP server；LSP 机制已随 post-write-check 删除（[docs/post-write-check-plan]），
# 现仅剩主程序，保留 default-run 以免未来新增 bin 时 `cargo run` 歧义。
default-run = "codewave"

[lib]
name = "codewave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# desktop framework
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# Custom title bar (docs/23): Windows/Linux HTML control buttons + Win11 Snap Layout; macOS native traffic-light overlay
tauri-plugin-decoration = "3"

# async / serialization
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"
serde_yaml = "0.9"

# http / llm
reqwest = { version = "0.13", features = ["json", "socks", "stream", "gzip", "brotli"] }

# tools & safety
git2 = { version = "0.21", default-features = false }
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
tree-sitter-powershell = "0.26"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
similar = "3"

# storage & misc
flate2 = "1"
tempfile = "3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
sha2 = "0.11"
base64 = "0.23"
# 文本编码探测（[docs/office-and-pdf-support](../../docs/office-and-pdf-support.md)）：导出成 csv 的表格
# 常见 GBK，按 UTF-8 硬读会得到一片乱码。这个包同时在依赖树里（间接依赖已存在），不新增下载量。
encoding_rs = "0.8"
chrono = { version = "0.4", features = ["serde"] }
# Enabled in P1 (docs/03: introduced in P0 without being called); keyring 3.x with per-platform features
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dom_smoothie = "0.18.0"
# tokio-cron-scheduler 已移除（[docs/tasks-module-polish]）：调度器自始就走自写的 tick + cron crate
# （core/scheduler.rs 的 ScheduleKind），该依赖从未被引用，白担一份构建与供应链成本。
rmcp = { version = "3.1.4", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client", "client-side-sse", "transport-streamable-http-client-reqwest"] }
# MCP 子进程的进程树回收（Job Object / 进程组）：rmcp 的 transport-child-process 已以默认特性引入
# 同一份 10.0.0，这里只是把它变成直接依赖以便显式包裹 CommandWrap（零新增下载）。
process-wrap = "10"
cron = "0.17.0"

# Office 文档支持（docs/office-and-pdf-support）：
# - umya-spreadsheet：读写 .xlsx / .xlsm（样式、公式、多工作表）
# - docx-rs：生成 .docx（读取走自研解包，见 tools/document 模块）
# - zip + quick-xml：保真修改的基础设施（解开压缩包 → 只替换目标内部文件 → 其余原样搬运重打包），
#   绝不整份解析重建（重建会丢图表、数据透视表、迷你图）。zip 关默认特性只留 deflate，
#   避开默认特性中需要 C 工具链的压缩后端。
umya-spreadsheet = "3"
docx-rs = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
# PDF 文字提取。这个包有已知的崩溃记录（畸形文件会 panic），所以调用处必须做崩溃隔离，
# 见 tools/document/pdf.rs：绝不能让它的 panic 传到命令线程上。
pdf-extract = "0.12"

[dev-dependencies]
tempfile = "3"
chrono-tz = "0.10.4" # 固定时区测试 cron 跨 DST 回拨的两个 01:30
# docs/43: tokio::test(start_paused) virtual clock (test-util feature enabled for test builds only)
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# System notification click-to-reveal (notification batch): tauri-plugin-notification's desktop side does not
# expose click callbacks (actions are mobile-only), so the backend drives native notifications per platform —
# both crates are the same underlying desktop libraries that plugin uses, already present in Cargo.lock as
# transitive deps, zero new packages
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
# AUMID 注册表只读检测（Windows 通知缺陷修复，安装时由 NSIS 钩子写入键值——见
# windows/installer-hooks.nsh）：键存在 = 通知用自家 identifier（图标/标题归属与
# 点击激活都归本应用）；不存在（dev/便携）回退 POWERSHELL_APP_ID 只保显示
winreg = "0.56"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[profile.dev.package."*"]
opt-level = 1
